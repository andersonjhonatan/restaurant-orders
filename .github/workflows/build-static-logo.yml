name: Build static logo

on:
  push:
    branches:
      - main
    paths:
      - "tools/build_static_logo.py"
      - "assets/logo_parts/**"
      - ".github/workflows/build-static-logo.yml"

permissions:
  contents: write

jobs:
  build-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: pip install -r requirements.txt pytest==7.2.1 httpx==0.23.3

      - name: Generate approved logo
        run: python tools/build_static_logo.py

      - name: Verify exact approved bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          from src.app import _brand_logo_bytes

          generated = Path("frontend/assets/logo-sabor-da-casa.webp").read_bytes()
          current = _brand_logo_bytes()
          assert generated == current, "A logo gerada difere da versão aprovada."
          print(f"verified {len(generated)} exact bytes")
          PY

      - name: Commit generated asset
        run: |
          if [ -z "$(git status --porcelain -- frontend/assets/logo-sabor-da-casa.webp)" ]; then
            echo "Static logo already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/assets/logo-sabor-da-casa.webp
          git commit -m "chore: materializar logo aprovada"
          git push origin HEAD:main
