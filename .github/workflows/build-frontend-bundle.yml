name: Build frontend bundle

on:
  push:
    branches:
      - main
    paths:
      - "tools/build_frontend_bundle.py"
      - "frontend/styles.css"
      - "frontend/brand-refine-base.css"
      - "frontend/brand-refine.css"
      - "frontend/cart-actions.css"
      - "frontend/p1-enhancements.css"
      - "frontend/order-hardening.js"
      - "frontend/app.js"
      - "frontend/cart-actions.js"
      - "frontend/p1-enhancements.js"
      - ".github/workflows/build-frontend-bundle.yml"

permissions:
  contents: write

jobs:
  build-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate deterministic bundles
        run: python tools/build_frontend_bundle.py

      - name: Verify generated assets and HTML switch
        run: |
          python - <<'PY'
          from pathlib import Path
          from tools.build_frontend_bundle import NEW_CSS_TAG, NEW_JS_TAG, build_css, build_js, bundled_index

          css = Path("frontend/site.bundle.css").read_text(encoding="utf-8")
          js = Path("frontend/site.bundle.js").read_text(encoding="utf-8")
          index = Path("frontend/index.html").read_text(encoding="utf-8")
          assert css == build_css()
          assert js == build_js()
          assert NEW_CSS_TAG in index
          assert NEW_JS_TAG in index
          assert bundled_index(index) == index
          print("frontend bundles and index switch verified")
          PY

      - name: Commit generated bundles and asset tags
        run: |
          if [ -z "$(git status --porcelain -- frontend/site.bundle.css frontend/site.bundle.js frontend/index.html)" ]; then
            echo "Bundles and index already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/site.bundle.css frontend/site.bundle.js frontend/index.html
          git commit -m "chore: ativar bundle do frontend"
          git push origin HEAD:main
