name: Build frontend bundle

on:
  push:
    branches:
      - main
    paths:
      - "tools/build_frontend_bundle.py"
      - "frontend/styles.css"
      - "frontend/brand-refine-base.css"
      - "frontend/brand-refine.css"
      - "frontend/cart-actions.css"
      - "frontend/p1-enhancements.css"
      - "frontend/order-hardening.js"
      - "frontend/app.js"
      - "frontend/cart-actions.js"
      - "frontend/p1-enhancements.js"
      - ".github/workflows/build-frontend-bundle.yml"

permissions:
  contents: write

jobs:
  build-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate deterministic bundles
        run: python tools/build_frontend_bundle.py

      - name: Verify generated markers
        run: |
          python - <<'PY'
          from pathlib import Path
          from tools.build_frontend_bundle import build_css, build_js

          css = Path("frontend/site.bundle.css").read_text(encoding="utf-8")
          js = Path("frontend/site.bundle.js").read_text(encoding="utf-8")
          assert css == build_css()
          assert js == build_js()
          print("frontend bundles verified")
          PY

      - name: Commit generated bundles
        run: |
          if [ -z "$(git status --porcelain -- frontend/site.bundle.css frontend/site.bundle.js)" ]; then
            echo "Bundles already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/site.bundle.css frontend/site.bundle.js
          git commit -m "chore: materializar bundle do frontend"
          git push origin HEAD:main
